<!DOCTYPE html>
<html lang="ru" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self';
                   script-src 'self' https://cdn.jsdelivr.net https://www.gstatic.com;
                   style-src  'self' https://cdn.jsdelivr.net https://fonts.googleapis.com 'unsafe-inline';
                   font-src   'self' https://cdn.jsdelivr.net https://fonts.gstatic.com data:;
                   connect-src 'self' https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com https://firestore.googleapis.com;
                   img-src    'self' data: https:;
                   object-src 'none';">
    <meta http-equiv="Referrer-Policy" content="same-origin">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="X-Frame-Options" content="DENY">
    <title>Авторизация в системе — Милоновы</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <header class="site-header">
        <div class="container d-flex align-items-center justify-content-between">
            <a href="../index.html" class="d-flex align-items-center gap-2 text-decoration-none">
                <span class="brand-badge">M</span>
                <span class="brand-title">МИЛОНОВЫ</span>
            </a>
            <span class="badge bg-secondary-subtle text-secondary-emphasis border border-secondary-subtle font-mono">SYS.AUTH</span>
        </div>
    </header>

    <main class="container my-5 flex-grow-1 d-flex align-items-center justify-content-center">
        <div class="spotlight-card blur-fade" style="width: 100%; max-width: 440px;">
            <!-- Вкладки Вход / Регистрация -->
            <div class="d-flex p-1 mb-4 rounded bg-body-tertiary border border-secondary-subtle">
                <button type="button" class="btn btn-sm flex-fill fw-semibold btn-light" id="tabLoginBtn">Вход</button>
                <button type="button" class="btn btn-sm flex-fill fw-semibold text-secondary" id="tabRegisterBtn">Регистрация</button>
            </div>

            <!-- Форма входа -->
            <form id="loginForm">
                <div class="mb-3">
                    <label class="form-label" for="loginUsername">Идентификатор (ID, никнейм или Email)</label>
                    <input type="text" class="form-control font-mono" id="loginUsername" placeholder="Например: 264-013" required>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="loginPassword">Пароль</label>
                    <input type="password" class="form-control" id="loginPassword" placeholder="••••••••" required>
                </div>
                <button type="button" id="submitLoginBtn" class="btn-shiny btn-shiny-primary w-100 py-2 mt-2">
                    <i class="bi bi-box-arrow-in-right"></i> Войти в систему
                </button>
                <div class="text-center mt-3 small text-secondary">
                    Нет зарегистрированного профиля? <a href="#" class="text-white text-decoration-underline" id="switchToRegisterLink">Создать аккаунт</a>
                </div>
            </form>

            <!-- Форма регистрации -->
            <form id="registerForm" style="display: none;">
                <div class="row g-2 mb-3">
                    <div class="col-6">
                        <label class="form-label" for="firstName">Имя</label>
                        <input type="text" class="form-control" id="firstName" placeholder="Имя" required>
                    </div>
                    <div class="col-6">
                        <label class="form-label" for="lastName">Фамилия</label>
                        <input type="text" class="form-control" id="lastName" placeholder="Фамилия" required>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="userId">Игровой ID семьи</label>
                    <input type="text" class="form-control font-mono" id="userId" placeholder="Например: 859-200" required>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="email">Электронная почта</label>
                    <input type="email" class="form-control font-mono" id="email" placeholder="user@milonovy.ru" required>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="password">Пароль (мин. 8 символов, цифра и знак)</label>
                    <input type="password" class="form-control" id="password" placeholder="••••••••" required>
                </div>
                <button type="button" id="registerBtn" class="btn-shiny btn-shiny-primary w-100 py-2 mt-2">
                    <i class="bi bi-person-plus"></i> Зарегистрироваться
                </button>
                <div class="text-center mt-3 small text-secondary">
                    Уже есть профиль? <a href="#" class="text-white text-decoration-underline" id="switchToLoginLink">Вернуться ко входу</a>
                </div>
            </form>
        </div>
    </main>

    <footer class="site-footer">
        <div class="container d-flex flex-column flex-sm-row align-items-center justify-content-between gap-2 text-center text-sm-start font-mono small">
            <div>&copy; 2026 MILONOV EVENT PLATFORM. Все права защищены.</div>
            <div class="text-secondary">КОНТУР АУТЕНТИФИКАЦИИ</div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script src="../js/firebase-db.js"></script>
    <script src="../js/script.js"></script>
</body>
</html>
